<title id="title">India and Pakistan: spending per person as a share of US spending</title>
<desc id="description">Speculative scenarios for India and Pakistan in 2026, 2030, 2035. Points show middle values; whiskers show p10 to p90 ranges on one linear scale. All values are percentages of observed US spending per person in 2025. These ranges are not calibrated confidence intervals.</desc>
<metadata>Source: research/india-pakistan/data/altprotein_proxy_scenarios.csv; quantity: per_capita_share_of_us_2025; values copied directly from scenario rows. AI-assisted working figure; human verification pending.</metadata>
