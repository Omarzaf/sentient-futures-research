name: Verify research library

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check curated files and evidence references
        run: node tools/verify.mjs
      - name: Check halal workstream rules against fixtures
        run: node tools/test-halal-checks.mjs
      - name: Check Phase One evidence and privacy rules against fixtures
        run: node tools/test-phase1-checks.mjs
      - name: Check paper citation and trace rules against fixtures
        run: node tools/test-paper-checks.mjs
      - name: Check citation capture integrity without network
        run: node tools/test-fetch-citations.mjs
      - name: Check survey data package against fixtures
        run: node tools/test-survey-checks.mjs
      - name: Check privacy detector fixtures
        run: node tools/test-privacy-checks.mjs
      - name: Check reviewed supervisor exports and script data boundaries
        run: node tools/test-supervisor-publication-checks.mjs
      - name: Check public supervisor source and claim bindings (C1-C5 only)
        run: python3 tools/verify_edition.py --only C1,C2,C3,C4,C5
      - name: Block synthetic values from publication surfaces
        run: python3 research/household-demand/synthetic.py --check
      - name: Run Python regression suites (machine-bound export tests excluded)
        run: |
          python3 -m venv "$RUNNER_TEMP/py"
          PY="$RUNNER_TEMP/py/bin/python"
          "$PY" -m pip install --quiet numpy==2.5.4 pandas==3.0.6 pyarrow==26.0.0 xlrd==2.0.2 pytest==9.1.1
          "$PY" -m pytest -q -p no:cacheprovider research/household-demand
          "$PY" -m pytest -q -p no:cacheprovider research/india-pakistan/report/revisions/2026-10-27/tests
          # Pandoc, the local style detector and a macOS Chromium path are absent on the runner.
          "$PY" -m pytest -q -p no:cacheprovider research/india-pakistan/tests -k "not real_chromium and not real_pandoc and not pandoc_ast and not local_style_detector"
          cd research/india-pakistan/pipeline && "$PY" -m pytest -q -p no:cacheprovider -c pytest.ini tests
      - name: Check October continuation evidence against fixtures
        run: node tools/test-continuation-checks.mjs
      - name: Check MMM reading edition against the manuscript
        run: node presentations/halal-mmm/build/check.mjs
      - name: Check deterministic reading-edition, catalog and manifest builds
        run: |
          node presentations/halal-mmm/build/build.mjs
          python3 research/india-pakistan/edition/build.py
          python3 research/india-pakistan/tools/build_report.py
          node tools/build-library.mjs
          git diff --exit-code
